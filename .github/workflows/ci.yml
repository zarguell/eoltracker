# Pull-request verification for the catalog engine and static site.
#
# Runs entirely against the catalog committed to the branch: no upstream
# ingestion (`import-data` is never called) and no publication. Publication
# belongs exclusively to .github/workflows/publish.yml.
name: CI

on:
  pull_request:
    branches: [main]

# Read-only: this workflow only checks out and builds.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify catalog and site build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Validate catalog data
        run: python -m engine validate

      - name: Build static site
        run: python -m engine build
