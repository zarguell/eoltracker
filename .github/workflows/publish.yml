# Catalog refresh and publication.
#
# Order matters here, and it is the fix for issue #81. The job does, in order:
#
#   1. refresh the catalog from upstream (scheduled runs only),
#   2. commit the refreshed data and REBASE it onto the latest main,
#   3. validate the catalog and run the test suite,
#   4. build `_site` — from the tree that was just synchronized,
#   5. push that commit to main (a fast-forward push; see the guard below),
#   6. publish the same `_site` tree to both Pages paths.
#
# The previous version built `_site` first and rebased afterwards, so a commit
# landing on main mid-run published a site that did not correspond to the
# commit it pushed. The authoritative validation, tests and build now all run
# against the exact synchronized SHA, and both publication paths consume that
# one tree, so the artifact and the pushed commit are the same revision by
# construction.
#
# The push cannot silently mispublish either: `git push origin HEAD:main` is not
# forced, so if main advanced after the rebase the push is rejected and the run
# fails before either Pages path publishes anything.
#
# Split rationale: `deploy` holds the Pages/OIDC permissions and uploads the
# artifact the build job produced; the write-capable `contents: write` grant
# lives only in the build job, which is the only job that pushes.
#
# Triggers:
#   * push to main      - build the catalog committed to main and publish it.
#                         No upstream requests: what is committed is shipped.
#   * schedule (daily)  - refresh the catalog from upstream, commit the data
#                         changes back to main, then publish.
#   * workflow_dispatch - same as the scheduled run, on demand.
#
# Only main is ever published. A commit pushed with the runner's GITHUB_TOKEN
# does not trigger further workflow runs, so writing data back to main cannot
# loop back into this workflow. Generated output (_site) is gitignored and
# never lands on main.
name: Publish

on:
  push:
    branches: [main]
  schedule:
    # Daily upstream refresh and republication, 05:23 UTC.
    - cron: '23 5 * * *'
  workflow_dispatch:

# Read-only by default; the build job grants itself `contents: write` because it
# is the one job that pushes. Every job states its own permissions explicitly so
# a future job cannot inherit a write token by accident (issue #101).
permissions:
  contents: read

concurrency:
  # One writer at a time. A run mutates data/ and pushes to main and to
  # gh-pages, so concurrent runs must not race the catalog. A run already in
  # progress is never cancelled (a half-finished refresh must not be
  # interrupted); a queued run waits its turn, and a newer queued run replaces
  # an older queued one.
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Refresh, synchronize, validate, build and publish files
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # contents: write - push the refreshed data commit and the gh-pages branch.
    permissions:
      contents: write
    steps:
      - name: Check out full source history
        # Actions are pinned to reviewed full commit SHAs (issue #101). The
        # trailing comment records the readable tag; Renovate bumps the SHA and
        # the comment together, never a floating tag.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7
        with:
          python-version: '3.14'

      - name: Install hash-locked dependencies
        # `--require-hashes` refuses any distribution not in requirements.lock,
        # so a compromised index or a hijacked transitive dependency cannot
        # execute in a job that holds a write token (issue #101).
        run: |
          python -m pip install --require-hashes -r requirements.lock

      # Registry-driven refresh attempts every source independently. Each failed
      # source rolls back its writes, including reports and ledger; successful
      # sources keep their results. A partial refresh now exits nonzero (#87),
      # so a broad upstream outage blocks publication instead of shipping a
      # catalog whose timestamps promise more freshness than its contents have.
      - name: Refresh registered upstream sources
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m engine refresh

      # ---- synchronization, BEFORE anything authoritative runs (#81) -------
      # Commit the refreshed data and rebase onto the newest main. Everything
      # below validates and builds this exact revision.
      - name: Commit refreshed data and synchronize with main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo 'No catalog changes to commit.'
          else
            git add --all -- data
            git commit -m 'chore(data): refresh catalog from upstream'
          fi
          git fetch origin main
          git rebase origin/main
          echo "Synchronized commit: $(git rev-parse HEAD)"

      # ---- authoritative validation and build -----------------------------
      - name: Validate catalog data
        run: python -m engine validate

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Build the complete site
        run: python -m engine build

      # GitHub Pages serves from a ~1GB artifact budget. Failing here, on the
      # run that crossed the line, beats discovering it as a deploy failure.
      - name: Check published site size budget
        run: python -m engine.site_budget

      # The exact commit the built tree corresponds to, written into the tree so
      # the deployed site can be checked against the SHA that produced it
      # (issue #81 verification). Every publication path carries this tree, so
      # the marker travels with the artifact and the branch.
      - name: Stamp the built tree with the commit it was built from
        run: |
          printf '%s\n' "$(git rev-parse HEAD)" > _site/BUILD-COMMIT.txt
          echo "Built $(cat _site/BUILD-COMMIT.txt)"

      # Push only after the build succeeded, and never forced: if main advanced
      # since the rebase above, this push is rejected and the run fails before
      # either Pages path publishes, rather than publishing a tree that no
      # commit on main corresponds to.
      - name: Push the synchronized commit to main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          ahead="$(git rev-list --count origin/main..HEAD)"
          if [ "$ahead" = "0" ]; then
            echo 'Nothing to push: the catalog matches main.'
            exit 0
          fi
          echo "Pushing $ahead commit(s) to main."
          git push origin HEAD:main

      # Hand the freshly built site to the Pages deployment job. _site only.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # actions/upload-pages-artifact v5
        with:
          path: _site

      # Branch deployment as well, so the site is served from gh-pages. This
      # publishes the tree built above — the same one the artifact carries — so
      # both Pages paths describe one revision (issue #81).
      - name: Publish site to gh-pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # peaceiris/actions-gh-pages v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # gh-pages is a build artifact, not a source of truth: keep it a
          # single-commit branch instead of accumulating one full site copy per
          # run. Serialized by the concurrency group above, so the forced push
          # cannot race another publisher.
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pages: write - create the Pages deployment.
    # id-token: write - mint the OIDC token that proves the run may deploy.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # actions/deploy-pages v5
