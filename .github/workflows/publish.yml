# Catalog refresh and publication.
#
# Every run installs dependencies, validates the catalog, runs the test suite
# and builds the site into _site. Publication is redundant on purpose:
#
#   * _site is pushed to the `gh-pages` branch with peaceiris/actions-gh-pages
#     (the branch deployment path for this public repository), and
#   * the same _site is uploaded with actions/upload-pages-artifact and released
#     through actions/deploy-pages, so Pages publishes even when a commit pushed
#     by the runner's GITHUB_TOKEN would not kick off a legacy branch build.
#
# Triggers:
#   * push to main      - build the catalog committed to main and publish it.
#                         No upstream requests: what is committed is shipped.
#   * schedule (daily)  - refresh the catalog from upstream, commit the data
#                         changes back to main, then publish.
#   * workflow_dispatch - same as the scheduled run, on demand.
#
# Only main is ever published. A commit pushed with the runner's GITHUB_TOKEN
# does not trigger further workflow runs, so writing data back to main cannot
# loop back into this workflow, and publication never depends on that commit:
# the same run publishes the site it just built. Generated output (_site) is
# gitignored and never lands on main.
name: Publish

on:
  push:
    branches: [main]
  schedule:
    # Daily upstream refresh and republication, 05:23 UTC.
    - cron: '23 5 * * *'
  workflow_dispatch:

# No PAT and no repository secret are required: the runner-issued GITHUB_TOKEN
# covers both publication paths.
permissions:
  contents: read

concurrency:
  # One writer at a time. A run mutates data/ and pushes to main and to
  # gh-pages, so concurrent runs must not race the catalog. A run already in
  # progress is never cancelled (a half-finished refresh must not be
  # interrupted); a queued run waits its turn, and a newer queued run replaces
  # an older queued one.
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Refresh, build and publish files
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # contents: write - commit refreshed data to main and push the gh-pages branch.
    permissions:
      contents: write
    steps:
      - name: Check out full source history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Upstream ingestion only where it is wanted: scheduled and manual runs.
      # A failure here fails the job before anything is committed or published,
      # so the last successful deployment stays live. Software (endoflife.date
      # API) and hardware (eosl.date pages, ~240 polite requests) refresh
      # independently: one source failing does not lose the other's update.
      - name: Import upstream software catalog
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: python -m engine import-data

      - name: Import upstream hardware catalog
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: python -m engine import-hardware

      - name: Validate catalog data
        run: python -m engine validate

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Build static site
        run: python -m engine build

      # Only the normalized catalog is written back; the generated site stays
      # out of main. An unchanged catalog is a success, not a failure.
      - name: Commit refreshed data to main
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo 'No catalog changes to commit.'
            exit 0
          fi
          git add --all -- data
          git commit -m 'chore(data): refresh catalog from upstream'
          git pull --rebase origin main
          git push origin HEAD:main

      # Hand the freshly built site to the Pages deployment job. _site only.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Branch deployment as well, so the site is served from gh-pages.
      - name: Publish site to gh-pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # gh-pages is a build artifact, not a source of truth: keep it a
          # single-commit branch instead of accumulating one full site copy per
          # run. Serialized by the concurrency group above, so the forced push
          # cannot race another publisher.
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pages: write - create the Pages deployment.
    # id-token: write - mint the OIDC token that proves the run may deploy.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
